server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    location /3d_viewer_electron/ {
        try_files $uri $uri.html $uri/index.html /3d_viewer_electron/zh/index.html;
    }

    location / {
        return 301 /3d_viewer_electron/zh/;
    }

    error_page 404 /3d_viewer_electron/zh/404.html;
}
